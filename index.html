<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Huyền Bài — Học Tarot mỗi ngày</title>
<meta name="description" content="Nền tảng học Tarot tương tác — ghi nhớ, khám phá và làm chủ 78 lá bài." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css" />
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<div class="page">
  <div class="topbar">
    <div class="brand"><span class="brand-mark">✦</span><span data-i18n="appName">Huyền Bài</span></div>
    <div class="lang-switch">
      <button data-lang="vi">Tiếng Việt</button>
      <button data-lang="en">English</button>
    </div>
  </div>

  <div class="container">
    <section class="hero">
      <div class="orbit-system" id="orbit-system">
        <div class="orbit-ring"></div>
        <div class="orbit-ring r2"></div>
        <div class="hero-card">
          <img id="hero-card-img" src="" alt="" />
        </div>
        <!-- orbit-node elements injected by JS for responsive angle placement -->
      </div>
      <div class="hero-title-wrap">
        <span class="eyebrow" data-i18n="heroEyebrow">Hành trình 78 lá bài</span>
        <h1 data-i18n="heroTitle">Học Tarot như một cuộc phiêu lưu</h1>
        <p data-i18n="heroSubtitle">Ghi nhớ, khám phá và làm chủ toàn bộ bộ bài — từng lá một.</p>
      </div>
    </section>

    <div class="stat-strip">
      <div class="panel stat-chip"><div class="num" id="stat-learned">0</div><div class="lbl" data-i18n="statLearned">Đã nhớ</div></div>
      <div class="panel stat-chip"><div class="num" id="stat-review">0</div><div class="lbl" data-i18n="statReview">Cần ôn thêm</div></div>
      <div class="panel stat-chip"><div class="num" id="stat-total">78</div><div class="lbl" data-i18n="statTotal">Tổng số lá</div></div>
    </div>

    <div class="section-head">
      <h2 data-i18n="cardOfDay">Lá bài hôm nay</h2>
    </div>
    <div class="panel daily-card" id="daily-card">
      <img id="daily-card-img" src="" alt="" />
      <div class="txt">
        <span class="eyebrow" id="daily-card-type"></span>
        <h3 id="daily-card-name">…</h3>
        <p id="daily-card-kw"></p>
      </div>
      <button class="btn btn-ghost" id="daily-card-btn" data-i18n="cardOfDayCta">Xem chi tiết</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" data-page="index.html"><span class="icon">🏠</span><span data-i18n="navHome">Trang chủ</span></a>
    <a href="flashcard.html" data-page="flashcard.html"><span class="icon">🃏</span><span data-i18n="navStudy">Học bài</span></a>
    <a href="quiz.html" data-page="quiz.html"><span class="icon">❓</span><span data-i18n="navQuiz">Trắc nghiệm</span></a>
    <a href="explorer.html" data-page="explorer.html"><span class="icon">🔭</span><span data-i18n="navExplorer">Khám phá</span></a>
    <a href="progress.html" data-page="progress.html"><span class="icon">🌙</span><span data-i18n="navProgress">Tiến độ</span></a>
  </nav>
</div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal-sheet" id="modal-sheet"></div>
</div>

<script src="assets/js/particles.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/card-modal.js"></script>
<script src="assets/js/home.js"></script>
</body>
</html>
